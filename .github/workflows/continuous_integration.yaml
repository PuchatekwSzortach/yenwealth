name: Continuous integration
on: [push]

jobs:
  run_commit_stage:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: install dependencies
        run: |
          pip install -e .
      - name: run tests
        run: pytest ./tests
