[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yenwealth"
version = "0.6.2"
description = "Financial planning tools for individuals living in Japan"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "arch>=8.0.0",
    "beartype>=0.22.2",
    "loky>=3.5.2",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.1",
    "tqdm>=4.68.3"
]

[project.optional-dependencies]
dev = [
    "codespell",
    "icecream",
    "mkdocstrings-python",
    "pycodestyle",
    "pyright",
    "pytest",
    "ruff",
    "zensical"
]

[tool.pyright]
  include = ["src", "tests", "examples", "scripts"]
  exclude = ["site"]

[tool.ruff]
line-length = 120
