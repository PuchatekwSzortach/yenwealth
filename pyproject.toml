[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yenwealth"
version = "0.5.3"
description = "Financial planning tools for individuals living in Japan"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "arch",
    "beartype",
    "loky",
    "numpy",
    "pandas",
    "pydantic",
    "returns",
    "tqdm"
]

[project.optional-dependencies]
dev = [
    "codespell",
    "icecream",
    "pycodestyle",
    "pyright",
    "pytest",
    "ruff"
]

[tool.ruff]
line-length = 120
