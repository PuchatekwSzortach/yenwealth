[project]
site_name = "yenwealth"
site_description = "Financial planning tools for individuals living in Japan"
site_url = "https://puchatekwszortach.github.io/yenwealth/"
repo_url = "https://github.com/PuchatekwSzortach/yenwealth"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
nav = [
    { "Home" = "index.md" },
    { "Getting started" = "getting-started.md" },
    { "Account model" = "account-model.md" },
    { "Simulations" = [
        "simulations/index.md",
        "simulations/deterministic.md",
        "simulations/monte-carlo.md",
        "simulations/analysis.md",
    ] },
]

[project.theme]
language = "en"
features = [
    "navigation.sections",
    "content.code.copy",
    "search.suggest",
    "search.highlight",
]

[project.plugins.api-autonav]
modules = ["src/yenwealth"]
api_root_uri = "reference"
nav_section_title = "API reference"

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
